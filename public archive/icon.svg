<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7FB8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A6FA8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="url(#bgGradient)" />

  <!-- "Trail" text - bold editorial, dark -->
  <text x="96" y="68" font-family="'Garamond', 'Georgia', serif" font-size="76" font-weight="700" text-anchor="middle" fill="#1a1a1a" letter-spacing="1" font-style="italic">Trail</text>

  <!-- "Mix" text - bold editorial, white -->
  <text x="96" y="140" font-family="'Garamond', 'Georgia', serif" font-size="76" font-weight="700" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">Mix</text>
</svg>